spring:
  application:
    name: PetInside

  datasource:
    url: jdbc:mysql://localhost:3306/petinside?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
            scope:
              - openid
              - email
              - profile

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: 8080
  # nginx 등 리버스 프록시 뒤에서 X-Forwarded-* 헤더로 원 요청의 scheme/host를 복원 (이미지 절대 URL 생성에 필요)
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000      # 1시간 (ms)
  refresh-token-expiration: 604800000   # 1주일 (ms)

app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth/callback}
  # 로컬 디스크 이미지 업로드 - EC2 재배포(scp)는 app.jar만 교체하므로 이 폴더는 그대로 보존됨
  upload:
    dir: ${UPLOAD_DIR:./uploads}

