name: Deploy Backend

on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Build JAR
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test

      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Upload JAR to EC2
        run: |
          scp -i key.pem -o StrictHostKeyChecking=no -o ServerAliveInterval=60 \
            backend/build/libs/*.jar \
            ec2-user@${{ secrets.EC2_HOST }}:/app/backend/app.jar

      - name: Write env and restart
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} \
            "printf 'DB_USERNAME=${{ secrets.DB_USERNAME }}\nDB_PASSWORD=${{ secrets.DB_PASSWORD }}\nJWT_SECRET=${{ secrets.JWT_SECRET }}\nGOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}\nGOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}\nGOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}\nCORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}\nOAUTH2_REDIRECT_URI=${{ secrets.OAUTH2_REDIRECT_URI }}\n' > /app/backend/.env && sudo systemctl restart petinside-backend"

      - name: Cleanup
        if: always()
        run: rm -f key.pem
