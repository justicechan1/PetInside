name: Deploy Backend

on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Build JAR
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test

      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Upload JAR to EC2
        run: |
          scp -i key.pem -o StrictHostKeyChecking=no -o ServerAliveInterval=60 \
            backend/build/libs/*.jar \
            ec2-user@${{ secrets.EC2_HOST }}:/app/backend/app.jar

      - name: Write env and restart
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} \
            "printf 'DB_USERNAME=${{ secrets.DB_USERNAME }}\nDB_PASSWORD=${{ secrets.DB_PASSWORD }}\nJWT_SECRET=${{ secrets.JWT_SECRET }}\nGOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}\nGOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}\nCORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}\nOAUTH2_REDIRECT_URI=${{ secrets.OAUTH2_REDIRECT_URI }}\nAWS_REGION=${{ secrets.AWS_REGION }}\nS3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}\n' > /app/backend/.env && sudo systemctl restart petinside-backend"
            # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY는 일부러 안 넣음 - EC2에 S3 권한 있는 IAM Role을 붙이면
            # SDK가 자동으로 그 Role을 사용해서 액세스 키를 서버에 둘 필요가 없음(권장). 그게 어렵다면 이 두 줄을 추가:
            # AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}\nAWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}\n

      - name: Cleanup
        if: always()
        run: rm -f key.pem
