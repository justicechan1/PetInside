name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Build JAR
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test

      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Upload JAR to EC2
        run: |
          scp -i key.pem -o StrictHostKeyChecking=no -o ServerAliveInterval=60 \
            backend/build/libs/*.jar \
            ec2-user@${{ secrets.EC2_HOST }}:/app/backend/app.jar

      - name: Write env and restart
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} \
            "printf 'DB_USERNAME=${{ secrets.DB_USERNAME }}\nDB_PASSWORD=${{ secrets.DB_PASSWORD }}\nJWT_SECRET=${{ secrets.JWT_SECRET }}\nGOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}\nGOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}\nGOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}\nCORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}\nOAUTH2_REDIRECT_URI=${{ secrets.OAUTH2_REDIRECT_URI }}\nPORTONE_STORE_ID=${{ secrets.PORTONE_STORE_ID }}\nPORTONE_CHANNEL_KEY=${{ secrets.PORTONE_CHANNEL_KEY }}\nPORTONE_CHANNEL_KEY_SUBSCRIPTION=${{ secrets.PORTONE_CHANNEL_KEY_SUBSCRIPTION }}\nPORTONE_API_SECRET=${{ secrets.PORTONE_API_SECRET }}\nPORTONE_WEBHOOK_SECRET=${{ secrets.PORTONE_WEBHOOK_SECRET }}\nBILLING_KEY_ENCRYPTION_SECRET=${{ secrets.BILLING_KEY_ENCRYPTION_SECRET }}\nPORTONE_WEBHOOK_NOTICE_URL=https://15-164-213-118.nip.io/api/v1/payments/webhook\nVAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}\nVAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}\n' > /app/backend/.env && sudo systemctl restart petinside-backend"

      - name: Cleanup
        if: always()
        run: rm -f key.pem
