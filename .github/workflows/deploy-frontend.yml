name: Deploy Frontend

on:
  push:
    branches: [develop]
    paths:
      - 'frontend/**'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build
        working-directory: frontend
        env:
          VITE_API_URL: https://${{ secrets.EC2_HOST }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: |
          npm ci
          npm run build

      - name: Deploy to EC2
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}
        run: |
          echo "$EC2_KEY" > key.pem
          chmod 600 key.pem
          ssh -i key.pem -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} \
            "sudo chown -R ec2-user:ec2-user /app/frontend"
          scp -i key.pem -o StrictHostKeyChecking=no -r \
            frontend/dist/. \
            ec2-user@${{ secrets.EC2_HOST }}:/app/frontend/
          ssh -i key.pem -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} \
            "sudo chown -R nginx:nginx /app/frontend && sudo systemctl reload nginx"
          rm key.pem
