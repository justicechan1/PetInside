spring:
  application:
    name: PetInside

  datasource:
    url: jdbc:h2:mem:petinside
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    user:
      name: admin
      password: REDACTED

server:
  port: 8080

